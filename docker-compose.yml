name: matchingjobs

networks:
  harukky-network:
    driver: bridge

volumes:
  postgres_data:

services:
  frontend-public:
    build: 
      dockerfile: ./docker/frontend-public/Dockerfile
      context: .
    networks:
      - harukky-network
    ports:
      - ${FRONTEND_PUBLIC_PORT:-5175}:80
    restart: unless-stopped

  frontend-company:
    build: 
      dockerfile: ./docker/frontend-company/Dockerfile
      context: .
    networks:
      - harukky-network
    ports:
      - ${FRONTEND_COMPANY_PORT:-5174}:80
    restart: unless-stopped

  frontend-admin:
    build: 
      dockerfile: ./docker/frontend-admin/Dockerfile
      context: .
    networks:
      - harukky-network
    ports:
      - ${FRONTEND_ADMIN_PORT:-5173}:80
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      args:
        UID: ${UID:-1000}
    volumes:
      - ./backend:/usr/share/nginx/html/laravel
    networks:
      - harukky-network
    ports:
      - ${API_PORT:-8000}:80
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      DB_CONNECTION: pgsql
      DB_HOST: psql
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-matchingjobs}
      DB_USERNAME: ${POSTGRES_USER:-username}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-abcd1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailcatcher
      MAIL_PORT: 1025
    depends_on:
      - psql
      - redis
    restart: unless-stopped

  psql:
    image: postgres:12.7-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PORT: 5433
      POSTGRES_DB: ${POSTGRES_DB:-matchingjobs}
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abcd1234}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    networks:
      - harukky-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    networks:
      - harukky-network
    restart: unless-stopped
  
  mailcatcher:
    image: dockage/mailcatcher:0.7.1
    ports:
      - ${MAILCATCHER_PUBLIC_PORT:-1080}:1080
      - ${MAILCATCHER_PORT:-1025}:1025
    networks:
      - harukky-network
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    environment:
      SWAGGER_JSON: /usr/share/nginx/html/docs/api.yaml
      PERSIST_AUTHORIZATION: "true"
      DOC_EXPANSION: "none"
    volumes:
      - ./docs:/usr/share/nginx/html/docs
    ports:
      - 8081:8080
    restart: unless-stopped

  wiremock:
    image: "wiremock/wiremock:latest"
    ports:
      - 8080:8080
    volumes:
      - ./wiremock/extensions:/var/wiremock/extensions
      - ./wiremock/__files:/home/wiremock/__files
      - ./wiremock/mappings:/home/wiremock/mappings
    entrypoint: ["/docker-entrypoint.sh", "--global-response-templating", "--disable-gzip", "--verbose"]
    networks:
      - harukky-network
    restart: unless-stopped
